<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Test WIND AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body,
    a-scene {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>

<body>

  <a-scene
    mindar-image="imageTargetSrc: Aquarius.mind; autoStart: true;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <a-assets>
      <a-asset-item
        id="AquariusModel"
        src="Aquarius.glb">
      </a-asset-item>
    </a-assets>

    <a-camera look-controls="enabled: false"></a-camera>

    <a-light
      type="point"
      intensity="5">
    </a-light>

    <a-entity mindar-image-target="targetIndex: 0">

      <a-gltf-model
        src="#AquariusModel"
        position="0 0 0"
        scale="0.1 0.1 0.1"
        rotation="0 90 0">
      </a-gltf-model>

    </a-entity>

  </a-scene>

</body>
</html>
