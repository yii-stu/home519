<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Test WIND AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body,
    a-scene {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>

<body>

  <a-scene
    mindar-image="imageTargetSrc: Aquarius.mind; autoStart: true;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <a-assets>
      <a-asset-item
        id="AquariusModel"
        src="Aquarius.glb">
      </a-asset-item>
    </a-assets>

    <a-camera look-controls="enabled: false"></a-camera>

    <a-light
      type="point"
      intensity="5">
    </a-light>

    <a-entity mindar-image-target="targetIndex: 0">

      <a-gltf-model
        src="#AquariusModel"
        position="0 0 0"
        scale="0.1 0.1 0.1"
        rotation="0 0 0">
      </a-gltf-model>

    <a-plane
       src="#AquariusModel"
       width="1.2"
       height="0.7"
       position="0 0 0"
       touch-transform>
      </a-plane>  

    </a-entity>

  </a-scene>
<!-- 自訂A-Frame 組件：觸控縮放、旋轉、雙擊重設-->
<script>
AFRAME.registerComponent('touch-transform', {
init: function () {
const el = this.el;
// 保存原始縮放值，用於雙擊重設
this.defaultScale = el.object3D.scale.x;
this.currentScale = this.defaultScale;
this.prevDistance = null;
this.prevAngle = null;
this.lastTap = 0;
// 雙擊重設大小與旋轉
el.addEventListener('click', () => {
const now = Date.now();
if (now - this.lastTap < 300) {
el.object3D.scale.set(this.defaultScale, this.defaultScale, this.defaultScale);
el.object3D.rotation.set(0, 0, 0);
this.currentScale = this.defaultScale;
}
this.lastTap = now;
});
const canvas = el.sceneEl.canvas;
// 偵測兩指觸控開始：計算初始距離與角度
canvas.addEventListener('touchstart', (e) => {
if (e.touches.length === 2) {
const dx = e.touches[0].clientX - e.touches[1].clientX;
const dy = e.touches[0].clientY - e.touches[1].clientY;
this.prevDistance = Math.hypot(dx, dy);
this.prevAngle = Math.atan2(dy, dx);
}
});
// 兩指移動時執行縮放與旋轉
canvas.addEventListener('touchmove', (e) => {
if (e.touches.length === 2 && this.prevDistance !== null) {
const dx = e.touches[0].clientX - e.touches[1].clientX;
const dy = e.touches[0].clientY - e.touches[1].clientY;
const dist = Math.hypot(dx, dy);
const angle = Math.atan2(dy, dx);
// 縮放：限制在0.5～3 倍之間
const scaleFactor = dist / this.prevDistance;
this.currentScale *= scaleFactor;
this.currentScale = Math.min(Math.max(this.currentScale, 0.5), 3);
el.object3D.scale.set(this.currentScale, this.currentScale, this.currentScale);
// 旋轉
const deltaAngle = angle - this.prevAngle;
const rot = el.object3D.rotation;
el.object3D.rotation.set(rot.x, rot.y, rot.z + deltaAngle);
// 更新參考值
this.prevDistance = dist;
this.prevAngle = angle;
e.preventDefault(); // 避免預設手勢行為
}
});
// 觸控結束後重置參考值
canvas.addEventListener('touchend', () => {
if (el.sceneEl.canvas.touches && el.sceneEl.canvas.touches.length < 2) {
this.prevDistance = null;
this.prevAngle = null;
}
});
}
});
</script>

</body>
</html>
